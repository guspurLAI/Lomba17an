<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pendaftaran Turnamen HUT RI ke-81 LAI</title>

    <!-- Bootstrap CSS & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <style>
        body { background: #f4f6f9; }
        .navbar { background: #b71c1c; }
        .navbar-brand { color: white; font-weight: bold; }
        .header-datetime { color: #ffebee; font-size: 0.9rem; font-weight: 500; }
        .card-dashboard { border: none; border-radius: 15px; color: white; box-shadow: 0 5px 15px rgba(0,0,0,.15); transition: .3s; }
        .card-dashboard:hover { transform: translateY(-5px); }
        .card1 { background: #d32f2f; }
        .card2 { background: #1976d2; }
        .card3 { background: #2e7d32; }
        .card4 { background: #ff9800; }
        .card-dashboard h2 { font-size: 35px; font-weight: bold; }
        .form-card, .table-card { border: none; border-radius: 15px; }
        footer { background: #b71c1c; color: white; padding: 15px; margin-top: 40px; }
    </style>
</head>

<body>

<!-- Header Navbar -->
<nav class="navbar">
    <div class="container d-flex justify-content-between align-items-center">
        <span class="navbar-brand">
            <i class="fa-solid fa-trophy"></i> TURNAMEN HUT RI KE-81 LAI
        </span>
        <div class="header-datetime text-end">
            <i class="fa-regular fa-clock me-1"></i>
            <span id="realtimeClock">Memuat waktu...</span>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <!-- Ringkasan Statistik -->
    <div class="row g-3">
        <div class="col-md-3">
            <div class="card card-dashboard card1">
                <div class="card-body text-center">
                    <i class="fa-solid fa-users fa-2x"></i>
                    <h2 id="totalPeserta">0</h2>
                    Total Peserta
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-dashboard card2">
                <div class="card-body text-center">
                    <i class="fa-solid fa-person fa-2x"></i>
                    <h2 id="pria">0</h2>
                    Peserta Pria
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-dashboard card3">
                <div class="card-body text-center">
                    <i class="fa-solid fa-person-dress fa-2x"></i>
                    <h2 id="wanita">0</h2>
                    Peserta Wanita
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-dashboard card4">
                <div class="card-body text-center">
                    <i class="fa-solid fa-medal fa-2x"></i>
                    <h2>2</h2>
                    Cabang Lomba
                </div>
            </div>
        </div>
    </div>

    <!-- Form & Grafik -->
    <div class="row mt-4">
        <div class="col-lg-6">
            <div class="card form-card shadow">
                <div class="card-header bg-danger text-white">
                    <b>Form Pendaftaran</b>
                </div>
                <div class="card-body">
                    <form id="registrationForm">
                        <div class="mb-3">
                            <label for="nama" class="form-label">Nama Peserta</label>
                            <input type="text" id="nama" class="form-control" placeholder="Nama Lengkap" required>
                        </div>
                        <div class="mb-3">
                            <label for="telepon" class="form-label">Nomor Telepon / WhatsApp</label>
                            <input type="tel" id="telepon" class="form-control" placeholder="Contoh: 08123456789" required>
                        </div>
                        <div class="mb-3">
                            <label for="bagian" class="form-label">Bagian</label>
                            <input type="text" id="bagian" class="form-control" placeholder="Contoh: Produksi, Maintenance, dll." required>
                        </div>
                        <div class="mb-3">
                            <label for="jenisKelamin" class="form-label">Jenis Kelamin</label>
                            <select id="jenisKelamin" class="form-select">
                                <option value="Laki-laki">Laki-laki</option>
                                <option value="Perempuan">Perempuan</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="cabangLomba" class="form-label">Cabang Lomba</label>
                            <select id="cabangLomba" class="form-select">
                                <option value="Badminton">Badminton</option>
                                <option value="Tenis Meja (Khusus Pria)" id="optTenisMeja">Tenis Meja (Khusus Pria)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-danger w-100">
                            <i class="fa-solid fa-paper-plane"></i> Daftar
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-6 mt-4 mt-lg-0">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <b>Grafik Peserta per Lomba</b>
                </div>
                <div class="card-body">
                    <canvas id="chartPeserta"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabel Data Peserta -->
    <div class="card table-card shadow mt-4">
        <div class="card-header bg-success text-white">
            <div class="d-flex justify-content-between align-items-center">
                <b>Data Peserta</b>
                <input type="text" id="searchInput" class="form-control w-50 w-md-25" placeholder="Cari...">
            </div>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Nama</th>
                            <th>Bagian</th>
                            <th>Lomba</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="5" class="text-center">Memuat data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<footer class="text-center">
    Dashboard Pendaftaran Turnamen HUT RI ke-81 LAI © 2026
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyPIlq0w5VHgPu9sFLQIt3ZG79DEunKS3UMqqcV6Eam47s6TFCglmWYWFwy9xJKqGlAag/exec";

let pesertaData = [];
let chartPeserta;

const form = document.getElementById("registrationForm");
const tableBody = document.getElementById("tableBody");
const searchInput = document.getElementById("searchInput");
const selectJenisKelamin = document.getElementById("jenisKelamin");
const selectCabangLomba = document.getElementById("cabangLomba");
const optTenisMeja = document.getElementById("optTenisMeja");

function updateClock() {
    const now = new Date();
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    const tanggal = now.toLocaleDateString('id-ID', options);
    const jam = String(now.getHours()).padStart(2, '0');
    const menit = String(now.getMinutes()).padStart(2, '0');
    const detik = String(now.getSeconds()).padStart(2, '0');

    document.getElementById('realtimeClock').innerHTML = `${tanggal} | ${jam}:${menit}:${detik} WIB`;
}

setInterval(updateClock, 1000);
updateClock();

selectJenisKelamin.addEventListener("change", function() {
    if (this.value === "Perempuan") {
        optTenisMeja.disabled = true;
        if (selectCabangLomba.value === "Tenis Meja (Khusus Pria)") {
            selectCabangLomba.value = "Badminton";
        }
    } else {
        optTenisMeja.disabled = false;
    }
});

form.addEventListener("submit", async function(e) {
    e.preventDefault();

    const submitBtn = form.querySelector("button[type='submit']");
    const noTelepon = document.getElementById("telepon").value.trim();
    
    // Mengirimkan 'telepon' sekaligus 'nik' agar backend versi lama maupun baru tidak melempar error
    const payload = {
        action: "register",
        nama: document.getElementById("nama").value.trim(),
        telepon: noTelepon,
        nik: noTelepon, 
        bagian: document.getElementById("bagian").value.trim(),
        departemen: document.getElementById("bagian").value.trim(),
        jenisKelamin: selectJenisKelamin.value,
        cabangLomba: selectCabangLomba.value
    };

    if (!payload.nama || !payload.telepon || !payload.bagian) {
        alert("Nama Peserta, Nomor Telepon / WhatsApp, dan Bagian wajib diisi.");
        return;
    }

    if (payload.jenisKelamin === "Perempuan" && payload.cabangLomba === "Tenis Meja (Khusus Pria)") {
        alert("Mohon maaf, cabang lomba Tenis Meja khusus untuk peserta Pria.");
        return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.success) {
            alert("Pendaftaran berhasil disimpan!");
            form.reset();
            optTenisMeja.disabled = false;
            loadData();
        } else {
            alert(result.message || "Pendaftaran gagal.");
        }

    } catch (error) {
        alert("Terjadi kesalahan koneksi: " + error.message);
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Daftar';
    }
});

async function loadData() {
    try {
        const response = await fetch(API_URL + "?action=getData");
        const result = await response.json();

        if (result.success) {
            pesertaData = result.data || [];
            updateDashboard();
            renderTable(pesertaData);
            updateChart();
        } else {
            throw new Error(result.message || "Gagal memuat data");
        }
    } catch (error) {
        console.error("Gagal mengambil data:", error);
        tableBody.innerHTML = `
            <tr>
                <td colspan="5" class="text-center text-danger fw-bold">
                    <i class="fa-solid fa-triangle-exclamation"></i> Gagal memuat data peserta.
                </td>
            </tr>
        `;
    }
}

function updateDashboard() {
    const total = pesertaData.length;
    const pria = pesertaData.filter(p => p.jenisKelamin === "Laki-laki").length;
    const wanita = pesertaData.filter(p => p.jenisKelamin === "Perempuan").length;

    document.getElementById("totalPeserta").innerText = total;
    document.getElementById("pria").innerText = pria;
    document.getElementById("wanita").innerText = wanita;
}

function renderTable(data) {
    if (!data.length) {
        tableBody.innerHTML = `<tr><td colspan="5" class="text-center">Belum ada data peserta.</td></tr>`;
        return;
    }

    let rowsHtml = "";
    data.forEach((p, index) => {
        const isPending = !p.status || p.status === "Pending";
        const statusText = isPending ? "Sudah Mendaftar" : p.status;
        const statusClass = 
            p.status === "Terverifikasi" ? "bg-success" :
            p.status === "Ditolak" ? "bg-danger" :
            isPending ? "bg-primary text-white" : "bg-secondary";

        const bagianText = p.bagian || p.departemen || "-";

        rowsHtml += `
            <tr>
                <td>${index + 1}</td>
                <td>${escapeHtml(p.nama)}</td>
                <td>${escapeHtml(bagianText)}</td>
                <td>${escapeHtml(p.cabangLomba)}</td>
                <td><span class="badge ${statusClass}">${escapeHtml(statusText)}</span></td>
            </tr>
        `;
    });

    tableBody.innerHTML = rowsHtml;
}

function updateChart() {
    const labels = ["Badminton", "Tenis Meja (Khusus Pria)"];
    const values = labels.map(label => pesertaData.filter(p => p.cabangLomba === label).length);

    if (chartPeserta) chartPeserta.destroy();

    const ctx = document.getElementById("chartPeserta").getContext("2d");
    chartPeserta = new Chart(ctx, {
        type: "bar",
        data: {
            labels: labels,
            datasets: [{
                label: "Jumlah Peserta",
                data: values,
                backgroundColor: ["#1976d2", "#ff9800"]
            }]
        },
        options: {
            responsive: true,
            scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
        }
    });
}

searchInput.addEventListener("input", function() {
    const keyword = this.value.toLowerCase();
    const filtered = pesertaData.filter(p =>
        String(p.nama || "").toLowerCase().includes(keyword) ||
        String(p.bagian || p.departemen || "").toLowerCase().includes(keyword) ||
        String(p.cabangLomba || "").toLowerCase().includes(keyword)
    );
    renderTable(filtered);
});

function escapeHtml(value) {
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

document.addEventListener("DOMContentLoaded", loadData);
</script>

</body>
</html>
